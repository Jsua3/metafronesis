<!-- La luz ambiental de la portada (dos radiales, violeta e info) sobre la página oscura de la piel game. -->
<div class="umbral-caso__luz" aria-hidden="true"></div>

<div class="umbral-caso__centro">
  <ui-portada-caso class="umbral-caso__portada" [tamano]="tamanoPortada()" [umbral]="true"
    [titulo]="titulo() || 'Caso'" [portada]="portada()" />

  <!-- h2: el h1 (oculto) del juego ya es el nombre del caso. Sin título todavía (URL directa), se espera sin inventarlo. -->
  @if (titulo(); as nombre) {
    <h2 class="umbral-caso__titulo">{{ nombre }}</h2>
  }

  <p class="umbral-caso__cuidado">
    <mat-icon aria-hidden="true">pause</mat-icon>
    <span>{{ cuidado }}</span>
  </p>

  <div class="umbral-caso__progreso" [class.game-boot]="arrancando()">
    <app-firma-progreso [pasos]="pasos()" [texto]="pasoTexto()" />
    <!-- BORRADOR: texto pendiente de Psicología. Progreso real de recursos, no del arranque completo. -->
    @if (fase() === 'escena' && porcentaje() !== null && !conTarjeta()) {
      <p class="umbral-caso__paso umbral-caso__paso--visible" role="progressbar" aria-label="Carga de recursos de la escena" aria-valuemin="0" aria-valuemax="100" [attr.aria-valuenow]="porcentaje()">{{ porcentaje() }} %</p>
    }
    <!-- La región de estado del juego anuncia la fase. -->
    <p class="umbral-caso__paso" [class.umbral-caso__paso--visible]="mostrarPaso()" aria-hidden="true">{{ mostrarPaso() ? pasoTexto() : '' }}</p>
  </div>

  @if (lento() && fase() !== 'listo') {
    <div class="umbral-caso__lento">
      <p>{{ textoLento }}</p>
      <button class="u-boton" ui-button type="button" variant="secondary" icon="arrow_back" (click)="volver.emit()">{{ volverEtiqueta() }}</button>
    </div>
  }

  @if (salida()) {
    <app-safe-exit-button class="umbral-caso__salida" variante="placa" [pausing]="pausando()" (pause)="salidaSegura.emit()" />
  }
</div>
