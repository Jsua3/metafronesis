[pytest]
DJANGO_SETTINGS_MODULE = psychosim.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --reuse-db -p no:cacheprovider
markers =
    req(*codes): código(s) de requisito PN3 o de SIEP que la prueba protege o cierra, p. ej. req("RN-07"); verify:estructural las cuenta
    security(*): prueba de un control de seguridad del plan 03 (exige también req); verify:seguridad las corre con -m security
