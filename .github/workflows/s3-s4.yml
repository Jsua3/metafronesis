name: Verificar S3 y S4
on:
  pull_request:
    branches: [develop]
  push:
    branches: [feature/s3-caso-intento]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: metafronesis_test
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: test_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_runner -d metafronesis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: metafronesis_test
      POSTGRES_USER: test_runner
      POSTGRES_PASSWORD: test_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-s3.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage_s3.py check
      - run: python manage_s3.py makemigrations --check --dry-run
      - run: python manage_s3.py migrate --noinput
      - run: python -m pytest -q
