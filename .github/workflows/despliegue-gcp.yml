name: Imagen y despliegue en Google Cloud
# SIEP-237 · Construye la imagen única (Angular + Django), la arranca contra PostgreSQL con los settings de producción como
# lo haría Cloud Run y comprueba lo básico (salud, SPA con nonce, usuario no root, filtro de hosts). En main (o a mano) la
# sube a Artifact Registry y la despliega en Cloud Run con Workload Identity Federation, sin llaves guardadas.
# Guía: docs/despliegue-gcp.md
on:
  pull_request:
    branches: [develop, main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/angular.json
      - psychosim/settings/**
      - shared/spa.py
      - shared/static_files.py
      - .github/workflows/despliegue-gcp.yml
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      desplegar:
        description: Publicar la imagen y desplegarla en Cloud Run
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: despliegue-gcp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  imagen:
    name: Construir y probar la imagen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: metafronesis_humo
          POSTGRES_USER: humo
          POSTGRES_PASSWORD: humo_solo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U humo -d metafronesis_humo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: metafronesis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prueba de humo con los settings de producción (como en Cloud Run)
        run: |
          gen() { python3 -c "import secrets; print(secrets.token_urlsafe(48))"; }
          for nombre in SECRET JWT REFLEXION LLAVE; do
            valor="$(gen)"; echo "::add-mask::$valor"; printf -v "$nombre" '%s' "$valor"
          done
          host="metafronesis-humo.us-east1.run.app"
          docker run -d --name humo --network host \
            -e PORT=8080 -e K_SERVICE=metafronesis -e DJANGO_ALLOWED_HOSTS="$host" \
            -e DATABASE_URL="postgres://humo:humo_solo_ci@127.0.0.1:5432/metafronesis_humo?sslmode=disable" \
            -e SIEP_TRUSTED_PROXIES=1 \
            -e DJANGO_SECRET_KEY="$SECRET" -e JWT_SIGNING_KEY="$JWT" -e REFLECTION_ENCRYPTION_KEY="$REFLEXION" \
            -e REFLECTION_ACTIVE_KEY=k1 -e REFLECTION_KEYS="k1=$LLAVE" \
            -e SIEP_ALLOW_CONSOLE_EMAIL=true -e ACCESS_REQUEST_NOTIFY_DISABLED=true \
            metafronesis:ci
          base="http://127.0.0.1:8080"
          codigo=000
          for _ in $(seq 1 45); do
            codigo="$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $host" "$base/api/health" || true)"
            [ "$codigo" = 200 ] && break
            sleep 2
          done
          docker logs humo 2>&1 | tail -n 30
          echo "/api/health -> $codigo"; test "$codigo" = 200
          # El SPA sale de la vista con nonce (nunca el marcador crudo) y sin caché.
          curl -sf -D cabeceras.txt -H "Host: $host" -H "X-Forwarded-Proto: https" "$base/" -o index.html
          grep -qi 'ngcspnonce="[A-Za-z0-9_-]\{16,\}"' index.html
          # (con set -e una línea «! grep …» no hace fallar el paso: se comprueba con if)
          if grep -q '__SIEP_CSP_NONCE__' index.html; then echo "::error::index.html con el marcador del nonce sin sustituir"; exit 1; fi
          grep -qi '^cache-control: no-store' cabeceras.txt
          # Sin la cabecera del frente, Django redirige a https; /api/health queda exento (ya probado arriba).
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $host" "$base/")" = 301
          # Un Host que no es el de la app se rechaza.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: otro.example' "$base/api/health")" = 400
          # El proceso corre como el usuario fijo no root de la imagen.
          test "$(docker exec humo id -u)" = 10001

  desplegar:
    name: Publicar y desplegar en Cloud Run
    needs: imagen
    # Solo cuando el repositorio ya tiene la configuración de Google Cloud (docs/despliegue-gcp.md, paso 9).
    if: >-
      vars.GCP_PROJECT_ID != '' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.desplegar))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: gcp
      url: ${{ steps.desplegar.outputs.url }}
    permissions:
      contents: read
      id-token: write
    env:
      PROYECTO: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICIO: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Nombre de la imagen
        id: nombre
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          repo="${REGION}-docker.pkg.dev/${PROYECTO}/metafronesis/metafronesis"
          echo "imagen=${repo}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "ultima=${repo}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # La misma construcción del trabajo anterior: sale de la caché de capas, no se recompila.
      - name: Publicar en Artifact Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.nombre.outputs.imagen }}
            ${{ steps.nombre.outputs.ultima }}
          cache-from: type=gha

      - name: Desplegar la revisión nueva
        id: desplegar
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
        run: |
          # Solo cambia la imagen: variables, secretos y la conexión a Cloud SQL se conservan. gcloud espera a que la
          # revisión nueva quede lista; si no arranca, falla y el tráfico sigue en la anterior.
          gcloud run deploy "$SERVICIO" --image "$IMAGEN" --region "$REGION" --project "$PROYECTO" --quiet
          url="$(gcloud run services describe "$SERVICIO" --region "$REGION" --project "$PROYECTO" --format 'value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Desplegada \`$IMAGEN\` en $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comprobar /api/health
        env:
          URL: ${{ steps.desplegar.outputs.url }}
        run: |
          for _ in $(seq 1 24); do
            codigo="$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health" || true)"
            [ "$codigo" = 200 ] && { echo "$URL/api/health -> 200"; exit 0; }
            sleep 5
          done
          echo "::error::$URL/api/health no respondió 200 en 2 minutos (último código: $codigo)"
          exit 1
